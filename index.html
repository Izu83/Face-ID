<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Face ID">
<meta name="theme-color" content="#17171a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<title>Face ID</title>
<style>
  :root { color-scheme: dark; }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: linear-gradient(#17171a, #0a0a0b 70%) #0a0a0b;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  body { position: fixed; inset: 0; touch-action: manipulation; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  .probe { position: fixed; padding-top: env(safe-area-inset-top); visibility: hidden; pointer-events: none; }

  /* ---------- Face ID island ----------
     Every moving part here is animated with transform/opacity only, so iOS
     runs it on the GPU at full refresh rate. */
  .island { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  /* The rounded shape is built from 2 bars + 4 circles. Scaling these keeps a
     perfect rounded rectangle at every size: pill -> square -> badge. */
  .shape { position: absolute; left: 0; top: 0; opacity: 0; }
  .pc {
    position: absolute;
    left: -100px;
    top: -100px;
    width: 200px;
    height: 200px;
    background: #000;
    transform: scale(0);
    will-change: transform;
  }
  .pc.c { border-radius: 50%; }
  .shape.green .pc { background: #30d158; }

  .glyph {
    position: absolute;
    left: -38px;
    top: -38px;
    width: 76px;
    height: 76px;
    opacity: 0;
    will-change: transform, opacity;
  }
  .layer { position: absolute; inset: 0; width: 76px; height: 76px; overflow: visible; will-change: transform, opacity; }
  .layer path, .layer circle { fill: none; stroke: #fff; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
  #ringWrap, #circle, #check { opacity: 0; }
  #check path { stroke-width: 6.5; }

  /* ---------- Success screen ---------- */
  .app {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(env(safe-area-inset-top), 20px) 24px calc(max(env(safe-area-inset-bottom), 16px) + 12px);
    pointer-events: none;
  }
  .app::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(110% 55% at 50% 0%, rgba(48, 209, 88, 0.18), transparent 70%);
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .app.show { pointer-events: auto; }
  .app.show::before { opacity: 1; transition: opacity 1.4s cubic-bezier(0.2, 0.8, 0.2, 1); }

  .app-center {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
  }
  .badge-slot { width: 88px; height: 88px; margin-bottom: 12px; }
  .app h1 { font-size: 34px; font-weight: 700; letter-spacing: 0.01em; }
  .app p { font-size: 17px; color: rgba(235, 235, 245, 0.6); }

  .reveal {
    opacity: 0;
    transform: translateY(14px) scale(0.98);
    filter: blur(10px);
    transition: opacity 0.25s ease, transform 0.3s ease, filter 0.25s ease;
    will-change: opacity, transform, filter;
  }
  .app.show .reveal {
    opacity: 1;
    transform: none;
    filter: blur(0);
    transition:
      opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) var(--d, 0s),
      transform 1s cubic-bezier(0.16, 1, 0.3, 1) var(--d, 0s),
      filter 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) var(--d, 0s);
  }

  .pill {
    position: relative;
    width: min(100%, 340px);
    height: 52px;
    border-radius: 26px;
    font-size: 17px;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.14);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
  }
  .pill:active { background: rgba(255, 255, 255, 0.22); }
  .app.show .pill:active { transform: scale(0.96); transition: transform 0.2s ease; }
</style>
</head>
<body>
  <div class="probe" id="probe"></div>

  <!-- Success screen -->
  <main class="app" id="app" aria-live="polite">
    <div class="app-center">
      <div class="badge-slot" id="slot"></div>
      <h1 class="reveal" style="--d: 0.05s">Successful</h1>
      <p class="reveal" style="--d: 0.12s">Face ID verified</p>
    </div>
    <button class="pill reveal" id="again" type="button" style="--d: 0.25s">Try again</button>
  </main>

  <!-- Face ID -->
  <div class="island" role="status" aria-label="Face ID">
    <div class="shape" id="shapeBlack"></div>
    <div class="shape green" id="shapeGreen"></div>

    <div class="glyph" id="glyph" aria-hidden="true">
      <svg class="layer" id="corners" viewBox="0 0 100 100">
        <path d="M8 30V20A12 12 0 0 1 20 8H30"/>
        <path d="M70 8H80A12 12 0 0 1 92 20V30"/>
        <path d="M92 70V80A12 12 0 0 1 80 92H70"/>
        <path d="M30 92H20A12 12 0 0 1 8 80V70"/>
      </svg>
      <div class="layer" id="face">
        <svg class="layer" id="eyes" viewBox="0 0 100 100"><path d="M33 36v8M67 36v8"/></svg>
        <svg class="layer" id="nose" viewBox="0 0 100 100"><path d="M51 36v19q0 5-5 5h-2"/></svg>
        <svg class="layer" viewBox="0 0 100 100"><path d="M35 70q15 10 30 0"/></svg>
      </div>
      <div class="layer" id="ringWrap">
        <svg class="layer" id="ring" viewBox="0 0 100 100"></svg>
      </div>
      <svg class="layer" id="circle" viewBox="0 0 100 100"><circle cx="50" cy="50" r="36"/></svg>
      <svg class="layer" id="check" viewBox="0 0 100 100"><path d="M27 52 L43 67 L74 34"/></svg>
    </div>
  </div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const wait = ms => new Promise(r => setTimeout(r, ms));

  // ---------- Springs, pre-baked into GPU keyframes ----------
  // The spring curve (SwiftUI-style response + damping) is sampled once and handed
  // to the browser as a keyframe animation, so nothing runs per frame in JS.
  const curves = new Map();
  function springCurve(response, damping) {
    const key = response + '/' + damping;
    if (curves.has(key)) return curves.get(key);
    const w0 = 2 * Math.PI / response;
    let f;
    if (damping < 1) {
      const wd = w0 * Math.sqrt(1 - damping * damping);
      f = t => 1 - Math.exp(-damping * w0 * t) * (Math.cos(wd * t) + damping * w0 / wd * Math.sin(wd * t));
    } else {
      f = t => 1 - Math.exp(-w0 * t) * (1 + w0 * t);
    }
    let dur = 0;
    for (let t = 0; t < 4; t += 1 / 240) if (Math.abs(1 - f(t)) > 0.0015) dur = t;
    dur += 1 / 60;
    const n = Math.max(16, Math.ceil(dur * 90));
    const samples = [];
    for (let i = 0; i <= n; i++) samples.push(i === n ? 1 : f(i / n * dur));
    const c = { dur: dur * 1000, samples };
    curves.set(key, c);
    return c;
  }

  function play(el, keyframes, options) {
    const a = el.animate(keyframes, { fill: 'both', easing: 'linear', ...options });
    if (el._anim) el._anim.cancel();
    el._anim = a;
    return a.finished.catch(() => {});
  }

  // Animate el along a spring; frame(v) maps progress (0 -> 1, may overshoot) to styles
  function spring(el, frame, { response = 0.5, damping = 1, delay = 0 } = {}) {
    const { dur, samples } = springCurve(response, damping);
    const n = samples.length - 1;
    return play(el, samples.map((v, i) => ({ offset: i / n, ...frame(v) })), { duration: dur, delay });
  }

  // ---------- Island geometry ----------
  const shapeBlack = $('shapeBlack'), shapeGreen = $('shapeGreen');
  for (const shape of [shapeBlack, shapeGreen]) {
    shape.innerHTML = '<div class="pc"></div><div class="pc"></div>' + '<div class="pc c"></div>'.repeat(4);
  }
  const piecesBlack = [...shapeBlack.children], piecesGreen = [...shapeGreen.children];

  let islandTop = 11, badgeY = 400;
  function measure() {
    // Line up with the hardware Dynamic Island when running from the Home Screen
    const inset = parseFloat(getComputedStyle($('probe')).paddingTop) || 0;
    islandTop = inset >= 60 ? 14 : 11;
    const r = $('slot').getBoundingClientRect();
    badgeY = r.top + r.height / 2;
  }

  const PILL = () => ({ w: 126, h: 37, r: 18.5, y: islandTop + 18.5 });
  const BOX = () => ({ w: 160, h: 160, r: 44, y: islandTop + 80 });
  const BADGE = () => ({ w: 88, h: 88, r: 44, y: badgeY });
  const mix = (a, b, t) => ({ w: lerp(a.w, b.w, t), h: lerp(a.h, b.h, t), r: lerp(a.r, b.r, t), y: lerp(a.y, b.y, t) });

  // Transforms for the 6 pieces of a rounded rect (w, h, corner r) centred at (cx, y)
  function pieceTransforms({ w, h, r, y }) {
    const cx = innerWidth / 2;
    const dx = w / 2 - r, dy = h / 2 - r, cs = (2 * r) / 200;
    const t = (x, yy, sx, sy) => `translate(${x.toFixed(2)}px, ${yy.toFixed(2)}px) scale(${Math.max(1e-4, sx).toFixed(4)}, ${Math.max(1e-4, sy).toFixed(4)})`;
    return [
      t(cx, y, w / 200, (h - 2 * r) / 200),
      t(cx, y, (w - 2 * r) / 200, h / 200),
      t(cx - dx, y - dy, cs, cs),
      t(cx + dx, y - dy, cs, cs),
      t(cx - dx, y + dy, cs, cs),
      t(cx + dx, y + dy, cs, cs),
    ];
  }

  function morphShape(from, to, opts) {
    for (let i = 0; i < 6; i++) {
      const f = v => ({ transform: pieceTransforms(mix(from, to, v))[i] });
      spring(piecesBlack[i], f, opts);
      spring(piecesGreen[i], f, opts);
    }
  }

  // Glyph follows the shape's centre
  const glyph = $('glyph');
  const glyphAt = (y, scale) => `translate(${(innerWidth / 2).toFixed(2)}px, ${y.toFixed(2)}px) scale(${scale.toFixed(4)})`;

  // ---------- Spinner ring: 4 arcs, same spots as the corner brackets ----------
  (() => {
    const R = 36, sweep = 64;
    let d = '';
    for (let i = 0; i < 4; i++) {
      const mid = 225 + 90 * i;
      const a0 = (mid - sweep / 2) * Math.PI / 180, a1 = (mid + sweep / 2) * Math.PI / 180;
      d += `M${(50 + R * Math.cos(a0)).toFixed(2)} ${(50 + R * Math.sin(a0)).toFixed(2)}` +
           `A${R} ${R} 0 0 1 ${(50 + R * Math.cos(a1)).toFixed(2)} ${(50 + R * Math.sin(a1)).toFixed(2)}`;
    }
    $('ring').innerHTML = `<path d="${d}"/>`;
  })();

  // ---------- Flow ----------
  const app = $('app');
  const corners = $('corners'), face = $('face'), eyes = $('eyes'), nose = $('nose');
  const ringWrap = $('ringWrap'), ring = $('ring'), circle = $('circle'), check = $('check');
  let busy = false;

  // Demo: authentication always succeeds for now
  async function authenticate() {
    await wait(1100);
    return true;
  }

  function resetGlyph() {
    for (const el of [corners, face, eyes, nose, ringWrap, ring, circle, check]) {
      if (el._anim) { el._anim.cancel(); el._anim = null; }
    }
    ring.getAnimations().forEach(a => a.cancel());
  }

  async function dropDown(fadeIn) {
    const A = PILL(), B = BOX();
    if (fadeIn) play(shapeBlack, [{ opacity: 0 }, { opacity: 1 }], { duration: 120 });
    const opts = { response: 0.6, damping: 0.76 };
    morphShape(A, B, opts);
    spring(glyph, v => ({
      transform: glyphAt(lerp(A.y, B.y, v), lerp(0.55, 1, v)),
      opacity: clamp((v - 0.35) / 0.45),
    }), opts);
    await wait(520);
  }

  async function scan() {
    // A gentle head turn, like the real glyph
    const ease = 'cubic-bezier(0.45, 0, 0.55, 1)';
    const look = (amp, squish) => [
      { offset: 0, transform: 'translateX(0px) scaleX(1)', easing: ease },
      { offset: 0.32, transform: `translateX(${-amp}px) scaleX(${squish})`, easing: ease },
      { offset: 0.72, transform: `translateX(${amp}px) scaleX(${squish})`, easing: ease },
      { offset: 1, transform: 'translateX(0px) scaleX(1)' },
    ];
    play(face, look(2.6, 0.95), { duration: 1000 });
    play(eyes, look(1.8, 1), { duration: 1000 });
    await play(nose, look(2.8, 1), { duration: 1000 });

    // Brackets swirl away as the spinning ring fades in
    spring(face, v => ({ transform: `translateX(0px) scaleX(1) scale(${lerp(1, 0.6, v)})`, opacity: clamp(1 - v * 1.4) }), { response: 0.45 });
    spring(corners, v => ({ transform: `rotate(${(95 * v).toFixed(2)}deg) scale(${lerp(1, 0.8, v)})`, opacity: clamp(1 - v * 1.25) }), { response: 0.55 });
    spring(ringWrap, v => ({ transform: `rotate(${lerp(-110, 0, v).toFixed(2)}deg) scale(${lerp(1.22, 1, v)})`, opacity: clamp(v * 1.5) }), { response: 0.6 });
    ring.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: 950, iterations: Infinity });

    const ok = await authenticate();
    if (!ok) return false;

    // Ring closes into a full circle, then folds into the check
    spring(circle, v => ({ opacity: v }), { response: 0.22 });
    await spring(ringWrap, v => ({ transform: 'rotate(0deg) scale(1)', opacity: 1 - v }), { response: 0.22 });
    spring(circle, v => ({ transform: `scale(${lerp(1, 0.5, v)})`, opacity: clamp(1 - v * 1.3) }), { response: 0.45 });
    spring(check, v => ({ transform: `scale(${lerp(0.35, 1, v)})`, opacity: clamp(v * 2) }), { response: 0.5, damping: 0.62 });
    await wait(700);
    ring.getAnimations().forEach(a => a.cancel());

    // The island glides down and becomes the green badge
    measure();
    const B = BOX(), C = BADGE();
    const opts = { response: 0.75, damping: 0.86 };
    morphShape(B, C, opts);
    spring(shapeGreen, v => ({ opacity: clamp(v * 1.2) }), { response: 0.6 });
    spring(glyph, v => ({ transform: glyphAt(lerp(B.y, C.y, v), 1), opacity: 1 }), opts);
    await wait(260);
    app.classList.add('show');
    return true;
  }

  async function start() {
    busy = true;
    measure();
    await dropDown(true);
    await scan();
    busy = false;
  }

  async function again() {
    if (busy) return;
    busy = true;
    app.classList.remove('show');
    await wait(80);

    // Badge flies back up and tucks into the island
    const A = PILL(), C = BADGE();
    const opts = { response: 0.6, damping: 1 };
    morphShape(C, A, opts);
    spring(shapeGreen, v => ({ opacity: clamp(1 - v * 1.5) }), opts);
    await spring(glyph, v => ({ transform: glyphAt(lerp(C.y, A.y, v), lerp(1, 0.5, v)), opacity: clamp(1 - v * 2) }), opts);

    resetGlyph();
    await wait(100);
    await dropDown();
    await scan();
    busy = false;
  }

  $('again').addEventListener('click', again);
  addEventListener('resize', measure);

  setTimeout(start, 450);
})();
</script>
</body>
</html>
