<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Face ID">
<meta name="theme-color" content="#000000">
<title>Face ID</title>
<style>
  :root { color-scheme: dark; }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  body { position: fixed; inset: 0; touch-action: manipulation; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  /* ---------- Face ID HUD ---------- */
  .hud {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 156px;
    height: 156px;
    border-radius: 38px;
    display: grid;
    place-items: center;
    background: rgba(44, 44, 46, 0.92);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    backdrop-filter: blur(40px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 20px 60px rgba(0, 0, 0, 0.5);
    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, -50%) scale(0.82);
    pointer-events: none;
    z-index: 10;
  }

  .glyph { width: 76px; height: 76px; overflow: visible; }
  .glyph path { fill: none; stroke: #fff; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
  #check { stroke-dasharray: 1; stroke-dashoffset: 1; }

  /* ---------- Success screen ---------- */
  .app {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(env(safe-area-inset-top), 20px) 24px calc(max(env(safe-area-inset-bottom), 16px) + 12px);
    background:
      radial-gradient(110% 55% at 50% 0%, rgba(48, 209, 88, 0.16), transparent 70%),
      #000;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.5s ease, visibility 0s linear 0.5s;
  }
  .app.show { opacity: 1; visibility: visible; transition: opacity 0.5s ease; }

  .app-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
  }
  .symbol { width: 88px; height: 88px; margin-bottom: 12px; opacity: 0; }
  .symbol path { stroke-dasharray: 1; stroke-dashoffset: 1; }
  .app h1 { font-size: 34px; font-weight: 700; letter-spacing: 0.01em; }
  .app p { font-size: 17px; color: rgba(235, 235, 245, 0.6); }
  .app h1, .app p, .app .pill { opacity: 0; }

  .app.show .symbol { animation: symbol-pop 0.75s cubic-bezier(0.2, 0.9, 0.25, 1) 0.05s forwards; }
  .app.show .symbol path { animation: draw 0.4s cubic-bezier(0.3, 0.8, 0.3, 1) 0.32s forwards; }
  .app.show h1 { animation: blur-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.18s forwards; }
  .app.show p { animation: blur-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.26s forwards; }
  .app.show .pill { animation: blur-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.4s forwards; }

  .pill {
    width: min(100%, 340px);
    height: 52px;
    border-radius: 26px;
    font-size: 17px;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.14);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
    transition: transform 0.25s cubic-bezier(0.3, 1.4, 0.5, 1), background 0.2s;
  }
  .pill:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.22); }

  @keyframes symbol-pop {
    0% { opacity: 0; transform: scale(0.4); }
    50% { opacity: 1; transform: scale(1.08); }
    75% { transform: scale(0.98); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes blur-in {
    from { opacity: 0; transform: translateY(10px); filter: blur(8px); }
    to { opacity: 1; transform: none; filter: blur(0); }
  }
</style>
</head>
<body>

  <!-- Success screen -->
  <main class="app" id="app" aria-live="polite">
    <div class="app-center">
      <svg class="symbol" viewBox="0 0 88 88" aria-hidden="true">
        <circle cx="44" cy="44" r="44" fill="#30d158"/>
        <path d="M27 45.5 L38.5 57 L61 33" pathLength="1" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>Successful</h1>
      <p>Face ID verified</p>
    </div>
    <button class="pill" id="again" type="button">Try again</button>
  </main>

  <!-- Face ID -->
  <div class="hud" id="hud" role="status" aria-label="Face ID">
    <svg class="glyph" viewBox="0 0 100 100" aria-hidden="true">
      <g id="corners"><path/><path/><path/><path/></g>
      <g id="face">
        <g id="eyes"><path d="M33 36v8"/><path d="M67 36v8"/></g>
        <path id="nose" d="M51 36v19q0 5-5 5h-2"/>
        <path d="M35 70q15 10 30 0"/>
      </g>
      <path id="check" d="M26 52 L43 68 L75 33" pathLength="1"/>
    </svg>
  </div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const wait = ms => new Promise(r => setTimeout(r, ms));

  // ---------- Spring physics (same model as SwiftUI: response + damping) ----------
  class Spring {
    constructor(value, onChange = () => {}) {
      this.x = this.target = value;
      this.v = 0;
      this.onChange = onChange;
      this.raf = 0;
      this.done = null;
    }
    stop() {
      cancelAnimationFrame(this.raf);
      this.raf = 0;
      const done = this.done;
      this.done = null;
      if (done) done();
    }
    set(value) {
      this.stop();
      this.x = this.target = value;
      this.v = 0;
      this.onChange(value);
    }
    to(target, { response = 0.4, damping = 0.85 } = {}) {
      this.stop();
      this.target = target;
      const k = (2 * Math.PI / response) ** 2;
      const c = 4 * Math.PI * damping / response;
      const eps = Math.max(1e-4, Math.abs(target - this.x) * 2e-4);
      return new Promise(resolve => {
        this.done = resolve;
        let last = performance.now();
        const step = now => {
          let dt = Math.min(0.064, (now - last) / 1000);
          last = now;
          while (dt > 0) {
            const h = Math.min(1 / 240, dt);
            this.v += (-k * (this.x - target) - c * this.v) * h;
            this.x += this.v * h;
            dt -= h;
          }
          if (Math.abs(this.x - target) < eps && Math.abs(this.v) < eps * 10) {
            this.x = target;
            this.v = 0;
            this.onChange(target);
            this.raf = 0;
            const done = this.done;
            this.done = null;
            if (done) done();
            return;
          }
          this.onChange(this.x);
          this.raf = requestAnimationFrame(step);
        };
        this.raf = requestAnimationFrame(step);
      });
    }
  }

  // ---------- Face ID glyph ----------
  // Each corner bracket is 1 start point + 3 cubic segments, so it can morph
  // point-for-point into an arc of the spinner ring.
  const K = 0.5523 * 12;
  const TL = [[8, 30], [8, 26.67], [8, 23.33], [8, 20], [8, 20 - K], [20 - K, 8], [20, 8], [23.33, 8], [26.67, 8], [30, 8]];
  const BRACKETS = [TL];
  for (let i = 1; i < 4; i++) BRACKETS.push(BRACKETS[i - 1].map(([x, y]) => [100 - y, x]));

  function arc(i, sweepDeg, r, rotDeg) {
    const mid = (225 + 90 * i + rotDeg) * Math.PI / 180;
    const sweep = sweepDeg * Math.PI / 180;
    const a0 = mid - sweep / 2, d = sweep / 3;
    const k = 4 / 3 * Math.tan(d / 4) * r;
    const P = a => [50 + r * Math.cos(a), 50 + r * Math.sin(a)];
    const pts = [P(a0)];
    for (let s = 0; s < 3; s++) {
      const a = a0 + s * d, b = a + d, p0 = P(a), p3 = P(b);
      pts.push(
        [p0[0] - k * Math.sin(a), p0[1] + k * Math.cos(a)],
        [p3[0] + k * Math.sin(b), p3[1] - k * Math.cos(b)],
        p3
      );
    }
    return pts;
  }

  const fmt = p => p[0].toFixed(2) + ',' + p[1].toFixed(2);
  const toPath = p => `M${fmt(p[0])}C${fmt(p[1])} ${fmt(p[2])} ${fmt(p[3])}C${fmt(p[4])} ${fmt(p[5])} ${fmt(p[6])}C${fmt(p[7])} ${fmt(p[8])} ${fmt(p[9])}`;

  const hud = $('hud');
  const app = $('app');
  const cornersG = $('corners');
  const cornerEls = [...cornersG.children];
  const faceG = $('face'), eyesG = $('eyes'), nose = $('nose'), check = $('check');

  const g = { m: 0, sweep: 64, r: 36, rot: 0, faceX: 0, faceOut: 0, ringOut: 0, check: 0 };
  const sp = {};
  for (const key of ['m', 'sweep', 'faceX', 'faceOut', 'ringOut', 'check']) {
    sp[key] = new Spring(g[key], x => { g[key] = x; });
  }
  const omega = new Spring(0); // spinner speed, deg/s

  function render() {
    for (let i = 0; i < 4; i++) {
      const a = BRACKETS[i], b = arc(i, g.sweep, g.r, g.rot);
      cornerEls[i].setAttribute('d', toPath(a.map((p, j) => [lerp(p[0], b[j][0], g.m), lerp(p[1], b[j][1], g.m)])));
    }
    cornersG.setAttribute('opacity', clamp(1 - g.ringOut));
    cornersG.setAttribute('transform', `translate(50 50) scale(${1 - 0.45 * g.ringOut}) translate(-50 -50)`);

    const fs = 1 - 0.3 * g.faceOut;
    faceG.setAttribute('opacity', clamp(1 - g.faceOut));
    faceG.setAttribute('transform', `translate(50 50) scale(${fs * (1 - 0.06 * Math.abs(g.faceX))} ${fs}) translate(-50 -50) translate(${g.faceX * 4} 0)`);
    eyesG.setAttribute('transform', `translate(${g.faceX * 2.5} 0)`);
    nose.setAttribute('transform', `translate(${g.faceX * 4} 0)`);

    check.style.strokeDashoffset = 1 - clamp(g.check);
    check.setAttribute('transform', `translate(50 50) scale(${0.7 + 0.3 * g.check}) translate(-50 -50)`);
  }

  let ticking = false, lastFrame = 0;
  function frame(now) {
    if (!ticking) return;
    g.rot = (g.rot + omega.x * (now - lastFrame) / 1000) % 360;
    lastFrame = now;
    render();
    requestAnimationFrame(frame);
  }
  function startTicker() {
    if (ticking) return;
    ticking = true;
    lastFrame = performance.now();
    requestAnimationFrame(frame);
  }

  function resetGlyph() {
    sp.m.set(0); sp.sweep.set(64);
    sp.faceX.set(0); sp.faceOut.set(0); sp.ringOut.set(0); sp.check.set(0);
    omega.set(0);
    g.rot = 0;
    render();
  }

  // HUD appear / disappear
  const pop = new Spring(0, x => {
    hud.style.visibility = x < 0.002 ? 'hidden' : 'visible';
    hud.style.opacity = clamp(x);
    hud.style.transform = `translate(-50%, -50%) scale(${0.82 + 0.18 * x})`;
  });

  // ---------- Flow ----------
  let busy = false;

  // Demo: authentication always succeeds for now
  async function authenticate() {
    await wait(1100);
    return true;
  }

  async function runFaceID() {
    if (busy) return;
    busy = true;
    app.classList.remove('show');
    resetGlyph();
    startTicker();

    pop.to(1, { response: 0.42, damping: 0.72 });
    await wait(380);

    // A small head turn, like the real glyph
    sp.faceX.to(-1, { response: 0.35, damping: 0.8 });
    await wait(330);
    sp.faceX.to(1, { response: 0.4, damping: 0.8 });
    await wait(380);
    sp.faceX.to(0, { response: 0.35, damping: 0.9 });

    // Brackets bend into a spinning ring
    sp.faceOut.to(1, { response: 0.3, damping: 1 });
    sp.m.to(1, { response: 0.5, damping: 0.8 });
    omega.to(420, { response: 0.6, damping: 1 });

    const ok = await authenticate();

    if (ok) {
      // Ring closes, then collapses into a check
      sp.sweep.to(90, { response: 0.3, damping: 1 });
      await wait(180);
      sp.ringOut.to(1, { response: 0.35, damping: 1 });
      sp.check.to(1, { response: 0.4, damping: 0.62 });
      await wait(850);
    }

    await pop.to(0, { response: 0.38, damping: 1 });
    ticking = false;
    if (ok) app.classList.add('show');
    busy = false;
  }

  $('again').addEventListener('click', runFaceID);

  resetGlyph();
  setTimeout(runFaceID, 500);
})();
</script>
</body>
</html>
